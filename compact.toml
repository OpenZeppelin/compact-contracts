# Deploy settings for the live test backend (contracts/test-utils/harness).

[profile]
default_network = "local"
src_dir         = "contracts"
artifacts_dir   = "contracts/artifacts"

# The local stack from local-env.yml. The harness refuses to deploy if these
# differ from its own endpoints.
[networks.local]
network_id   = "undeployed"
indexer      = "http://127.0.0.1:8088/api/v4/graphql"
indexer_ws   = "ws://127.0.0.1:8088/api/v4/graphql/ws"
node         = "http://127.0.0.1:9944"
node_ws      = "ws://127.0.0.1:9944"
proof_server = "http://127.0.0.1:6300"

# Every contract a live spec deploys. The harness creates the signing key on
# the first deploy.
[contracts."**/test/mocks/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"

[contracts."src/multisig/examples/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"
artifact         = "multisig/examples/{name}"

[contracts."src/token/examples/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"
artifact         = "token/examples/{name}"

[contracts."test/integration/_mocks/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"
artifact         = "integration/{name}"

# Artifacts mirror the source tree (`compact-compiler --hierarchical`), so each
# mocks directory names its own. Merged with `**/test/mocks/*` above.

[contracts."src/access/test/mocks/*"]
artifact = "access/test/mocks/{name}"

[contracts."src/identifier/test/mocks/*"]
artifact = "identifier/test/mocks/{name}"

[contracts."src/identifier/extensions/test/mocks/*"]
artifact = "identifier/extensions/test/mocks/{name}"

[contracts."src/archive/test/mocks/*"]
artifact = "archive/test/mocks/{name}"

[contracts."src/crypto/test/mocks/*"]
artifact = "crypto/test/mocks/{name}"

[contracts."src/crypto/authentication/test/mocks/*"]
artifact = "crypto/authentication/test/mocks/{name}"

[contracts."src/crypto/prf/test/mocks/*"]
artifact = "crypto/prf/test/mocks/{name}"

[contracts."src/crypto/randomness/test/mocks/*"]
artifact = "crypto/randomness/test/mocks/{name}"

[contracts."src/math/test/mocks/*"]
artifact = "math/test/mocks/{name}"

[contracts."src/multisig/test/mocks/*"]
artifact = "multisig/test/mocks/{name}"

[contracts."src/multisig/presets/test/mocks/*"]
artifact = "multisig/presets/test/mocks/{name}"

[contracts."src/security/test/mocks/*"]
artifact = "security/test/mocks/{name}"

[contracts."src/token/test/mocks/*"]
artifact = "token/test/mocks/{name}"

[contracts."src/token/presets/test/mocks/*"]
artifact = "token/presets/test/mocks/{name}"
[contracts."src/token/extensions/test/mocks/*"]
artifact = "token/extensions/test/mocks/{name}"

[contracts."src/utils/test/mocks/*"]
artifact = "utils/test/mocks/{name}"

# Doc-comment lint for `compact-linter`. compact-deploy ignores this table.

[lint]
include = ["contracts/src/**/*.compact"]
exclude = ["**/test/mocks/**", "**/archive/**"]

[lint.constraints]
compiler = "0.36.0"
artifacts = "contracts/artifacts"
# Contracts compile as they are; every module is measured through its mock.
self = ["**/presets/**", "**/examples/**"]

[lint.tags]
forbid = ["@return"]
rename = { "@return" = "@returns" }

# `sections` is every heading a module header may carry, in order. Only `@module`
# and `@description` are required.
[lint.kinds.module]
docs = "all"
tags = ["@module", "@description"]
sections = [
  "@module",
  "@description",
  "@dev Notation",
  "@dev Derivations",
  "@dev Parameterization",
  "@dev Compatibility",
  "@notice Privacy",
  "@notice Caller identity",
  "@dev Features",
  "@dev Commitment structure",
  "@dev Security Considerations",
  "@notice Missing Features and Improvements",
  "@dev Structure",
  "@notice Security",
  "@notice Concurrency",
  "@notice Scope",
  "@notice Not enforced",
  "@dev Layout",
  "@dev Key type",
  "@notice Assumption",
  "@dev Output",
  "@notice Caller duties",
  "@dev Authenticators",
  "@dev Why a struct",
  "@notice Further discussion and consideration required",
  "@notice Recipients must be coin public keys",
  "@notice Supply accounting is opt-in",
  "@notice Constructor usage",
  "@notice Minting and recipient privacy",
  "@notice Composition",
  "@notice Client-side duties",
  "@notice Scalability",
  "@dev Performance",
  "@dev Composition",
  "@dev Contract callers",
  "@notice This variant is deterministic and recipient-PUBLIC by design",
]

[lint.kinds.circuit]
tags = ["@description"]

[lint.kinds.ledger]
tags = ["@description"]

[lint.kinds.witness]
docs = "all"
tags = ["@description"]

[lint.kinds.struct]
tags = ["@description"]

[lint.kinds.enum]
tags = ["@description"]

[lint.kinds.constructor]
docs = "none"
