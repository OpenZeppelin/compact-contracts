# Deploy settings for the live test backend (contracts/test-utils/harness).

[profile]
default_network = "local"
src_dir         = "contracts"
artifacts_dir   = "contracts/artifacts"

# The local stack from local-env.yml. The harness refuses to deploy if these
# differ from its own endpoints.
[networks.local]
network_id   = "undeployed"
indexer      = "http://127.0.0.1:8088/api/v4/graphql"
indexer_ws   = "ws://127.0.0.1:8088/api/v4/graphql/ws"
node         = "http://127.0.0.1:9944"
node_ws      = "ws://127.0.0.1:9944"
proof_server = "http://127.0.0.1:6300"

# Every contract a live spec deploys. The harness creates the signing key on
# the first deploy.
[contracts."**/test/mocks/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"

[contracts."src/multisig/examples/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"
artifact         = "multisig/examples/{name}"

[contracts."src/token/examples/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"
artifact         = "token/examples/{name}"

[contracts."test/integration/_mocks/*"]
signing_key_file = "deploy/local.signingkey"
private_state_id = "{name}-ps"
artifact         = "integration/{name}"

# Artifacts mirror the source tree (`compact-compiler --hierarchical`), so each
# mocks directory names its own. Merged with `**/test/mocks/*` above.

[contracts."src/access/test/mocks/*"]
artifact = "access/test/mocks/{name}"

[contracts."src/archive/test/mocks/*"]
artifact = "archive/test/mocks/{name}"

[contracts."src/crypto/test/mocks/*"]
artifact = "crypto/test/mocks/{name}"

[contracts."src/multisig/test/mocks/*"]
artifact = "multisig/test/mocks/{name}"

[contracts."src/multisig/presets/test/mocks/*"]
artifact = "multisig/presets/test/mocks/{name}"

[contracts."src/security/test/mocks/*"]
artifact = "security/test/mocks/{name}"

[contracts."src/token/test/mocks/*"]
artifact = "token/test/mocks/{name}"

[contracts."src/token/presets/test/mocks/*"]
artifact = "token/presets/test/mocks/{name}"

[contracts."src/utils/test/mocks/*"]
artifact = "utils/test/mocks/{name}"
