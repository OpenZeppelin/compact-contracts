name: "Setup Environment"
description: "Sets up the environment with yarn, Node.js, turbo, and Compact compiler"

inputs:
  skip-compact:
    description: "Skip Compact compiler installation"
    required: false
    default: "false"
  compact-only:
    description: "Install only the Compact compiler, skipping the turbo cache, Node.js and the yarn install. For a job whose only purpose is to populate the compiler cache."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Deliberately skipped for a compiler-only setup: this entry is keyed on the
    # commit, so saving it from a job that compiles nothing would make every
    # later job in the run restore an empty cache instead of falling back to a
    # previous commit's populated one.
    - name: Cache turbo build setup
      if: ${{ inputs.compact-only != 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Enable corepack
      if: ${{ inputs.compact-only != 'true' }}
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      if: ${{ inputs.compact-only != 'true' }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"
        cache: "yarn"

    - name: Install dependencies
      if: ${{ inputs.compact-only != 'true' }}
      shell: bash
      run: yarn install --immutable

    - name: Setup Compact Compiler
      if: ${{ inputs.skip-compact != 'true' }}
      uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
      with:
        compact-version: "0.31.0"
