# PRs are squash-merged with the title as the commit subject, so the title must
# follow Conventional Commits with an optional scope.
# See CONTRIBUTING.md#commit-and-pr-conventions.
name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  lint-title:
    name: Lint PR Title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            The summary "{subject}" in "{title}" must start with a lowercase letter.
