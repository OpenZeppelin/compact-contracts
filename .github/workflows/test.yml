name: Compact Contracts Test Suite

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "biome.json"
      - "turbo.json"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "biome.json"
      - "turbo.json"

jobs:
  run-suite:
    name: Run Test Suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Recommended by turbo team

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Compile contracts
        run: yarn compile

      - name: Run type checks
        run: yarn types

      - name: Run tests
        run: yarn test

      - name: Run integration tests
        run: yarn test:integration

      - name: Run harness tests
        run: yarn test:harness

      # Dry unit tests for the live orchestrator (`scripts/live`) and the live CI
      # helpers (`scripts/ci`). No stack, no compiled artifacts.
      - name: Run script tests
        run: yarn test:scripts
