  live-security:
    # The matrix value is in the name on purpose: a caller job with a fixed name
    # renders every leg identically, so the spec under test has to appear here.
    name: live-security · ${{ matrix.name }}
    needs: [plan, compile-security]
    # The empty-legs guard is belt and braces: this target's compile is
