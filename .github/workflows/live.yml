      test-filter: ${{ matrix.testFilter }}

  # A failed scheduled run only emails the workflow author, which is easy to miss.
  # `live-ci.ts nightly` mirrors the nightly state into a `live-nightly` tracking
  # issue instead: opened (or commented) on failure, closed on the next green run.
  report-nightly:
    name: Report nightly result
    needs:
      - plan
      - compile-access
      - compile-crypto
      - compile-multisig
      - compile-security
      - compile-token
      - compile-utils
      - compile-integration
      - live-access
      - live-crypto
      - live-multisig
      - live-security
      - live-token
      - live-utils
      - live-integration
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      # For the cache-pruning step: deleting cache entries is a write.
      actions: write
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # PLAN_RESULT and COMPILE_RESULT are how the script separates "nothing was
      # tested" from "the suite passed": a spec job that never started reports
      # `skipped`, not `failure`, and a nightly that tested nothing is a failed
      # nightly whichever layer stopped it. Both aggregates take the worst result
      # across the per-target jobs, since `needs.*.result` is per job here.
      - name: Report to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUITE_RESULT: "${{ needs.live-access.result }} ${{ needs.live-crypto.result }} ${{ needs.live-multisig.result }} ${{ needs.live-security.result }} ${{ needs.live-token.result }} ${{ needs.live-utils.result }} ${{ needs.live-integration.result }}"
          PLAN_RESULT: ${{ needs.plan.result }}
          COMPILE_RESULT: "${{ needs.compile-access.result }} ${{ needs.compile-crypto.result }} ${{ needs.compile-multisig.result }} ${{ needs.compile-security.result }} ${{ needs.compile-token.result }} ${{ needs.compile-utils.result }} ${{ needs.compile-integration.result }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/live-ci.ts nightly

      # The cache entries here are large (a deps tree or a per-target turbo
      # slice is ~275 MB) against a 10 GB repo budget, past which GitHub evicts
      # least-recently-used — i.e. whatever the next run was about to need. The
      # nightly prunes deliberately instead: superseded entries (an older hash
      # under the same key prefix and ref) and anything not restored in 7 days
      # (`scripts/ci/caches.ts`). After the report on purpose, so a gh hiccup
      # here can never block the tracking issue.
      - name: Prune stale action caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/live-ci.ts prune-caches
