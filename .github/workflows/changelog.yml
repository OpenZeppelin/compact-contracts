name: Changelog

on:
  pull_request:
    # labeled/unlabeled re-run the changelog check when skip-changelog is toggled.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its parents.
          fetch-depth: 2
          persist-credentials: false

      # The script only imports node builtins, so this job needs a Node but no
      # `yarn install`.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Require a CHANGELOG entry for contract changes
        env:
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
          HEAD_REF: ${{ github.head_ref }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release-ci.ts changelog-check
